baseURL = "https://manuelcencerrado.com/"
title = "pcapcafe"
theme = "PaperMod"

# --- Multilenguaje ---
defaultContentLanguage = "es"          # el español es el idioma "canónico": vive en la raíz (/)
defaultContentLanguageInSubdir = false # el inglés se sirve bajo /en/

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 8

[outputs]
  home = ["HTML", "RSS", "JSON"]  # el JSON alimenta el buscador (/search/)

[minify]
  disableXML = true

# /llms.txt: índice del sitio en markdown para agentes/IA (llmstxt.org).
# La plantilla ya viene incluida en PaperMod (layouts/llms.txt), solo hacía
# falta declarar el formato. OJO: se activa solo para español más abajo
# (dentro de [languages.es.outputs]) y NO aquí en global, porque si se activa
# para los dos idiomas, el build de inglés sobrescribe el archivo de español
# al ser un output "root" (comprobado compilando el sitio en local).
[outputFormats.llms]
  baseName = "llms"
  isPlainText = true
  mediaType = "text/plain"
  rel = "alternate"
  root = true

# Parámetros comunes a los dos idiomas (cada idioma puede sobreescribir
# cualquiera de estos en su propio bloque [languages.xx.params])
[params]
  env = "production"
  author = "Manuel Cencerrado"
  defaultTheme = "dark"        # arranca en modo oscuro por defecto
  disableThemeToggle = false   # modo claro terminado: el usuario puede cambiar de tema
  displayFullLangName = true   # muestra "Español" / "English" en el selector, no "ES"/"EN"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = false
  favicon = "/favicon.ico"
  images = ["/images/portada-default.png"]

  # Secciones que cuentan como "artículos del blog" a efectos de:
  # - el listado de la home
  # - el listado agregado de /posts/ (ver layouts/posts/list.html)
  # Sin esto, Hugo elige automáticamente UNA sola sección como "principal"
  # y las demás no aparecerían ni en la home ni en /posts/.
  mainSections = ["posts", "ciberseguridad", "cloud"]

  [params.schema]
    # Blog personal de una persona, no de una organización/empresa:
    # así el JSON-LD (datos estructurados para Google) usa @type "Person"
    # en vez de "Organization" en publisher/autor.
    publisherType = "Person"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/manuel-cencerrado"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/manuelcencerrado"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    codeFences = true
    guessSyntax = true
    noClasses = false

# --- Definición de idiomas ---
[languages]

  [languages.es]
    label = "Español"
    locale = "es-ES"
    weight = 1
    title = "pcapcafe"

    [languages.es.params]
      description = "pcapcafe — Notas y capturas de un estudiante de ciberseguridad sobre hackeos, cloud y actualidad tech."

      [languages.es.params.homeInfoParams]
        Title = "pcapcafe$ whoami"
        Content = "Notas y capturas de un estudiante de Ingeniería Informática (UFV) especializándose en **ciberseguridad y cloud**. Un café, un pcap, y lo que voy aprendiendo por el camino."

    [languages.es.outputs]
      home = ["HTML", "RSS", "JSON", "llms"]

    [languages.es.menu]
      [[languages.es.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "posts/"
        weight = 10
      [[languages.es.menu.main]]
        identifier = "cloud"
        name = "Cloud"
        url = "cloud/"
        weight = 20
      [[languages.es.menu.main]]
        identifier = "ciberseguridad"
        name = "Ciberseguridad"
        url = "ciberseguridad/"
        weight = 30
      [[languages.es.menu.main]]
        identifier = "archive"
        name = "Archivo"
        url = "archive/"
        weight = 35
      [[languages.es.menu.main]]
        identifier = "search"
        name = "Buscar"
        url = "search/"
        weight = 40

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    title = "pcapcafe"

    [languages.en.params]
      description = "pcapcafe — Notes and packet captures from a cybersecurity student on hacks, cloud, and tech news."

      [languages.en.params.homeInfoParams]
        Title = "pcapcafe$ whoami"
        Content = "Notes from a Computer Engineering student (UFV) specializing in **cybersecurity and cloud**. A coffee, a pcap, and whatever I'm learning along the way."

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "posts/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "cloud"
        name = "Cloud"
        url = "cloud/"
        weight = 20
      [[languages.en.menu.main]]
        identifier = "ciberseguridad"
        name = "Cybersecurity"
        url = "ciberseguridad/"
        weight = 30
      [[languages.en.menu.main]]
        identifier = "archive"
        name = "Archive"
        url = "archive/"
        weight = 35
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "search/"
        weight = 40
